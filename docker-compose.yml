services:
  mysql:
    image: mysql:8.0
    container_name: yingshi-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yingshi
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-yzh666}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/main/resources/sql/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yingshi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yingshi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-yzh666}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY}
      MIMO_API_KEY: ${MIMO_API_KEY}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      EZVIZ_APP_KEY: ${EZVIZ_APP_KEY}
      EZVIZ_APP_SECRET: ${EZVIZ_APP_SECRET}
      EZVIZ_REDIRECT_URI: ${EZVIZ_REDIRECT_URI:-http://localhost/api/ezviz/oauth/callback}
      EZVIZ_FRONTEND_URL: ${EZVIZ_FRONTEND_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yingshi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
