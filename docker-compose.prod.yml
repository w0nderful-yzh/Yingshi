services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: yingshi
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Shanghai}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ALLOW_UNBOUND_DEVICE_ACCESS: ${ALLOW_UNBOUND_DEVICE_ACCESS:-false}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yingshi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://token-plan-cn.xiaomimimo.com}
      EZVIZ_APP_KEY: ${EZVIZ_APP_KEY:?EZVIZ_APP_KEY is required}
      EZVIZ_APP_SECRET: ${EZVIZ_APP_SECRET:?EZVIZ_APP_SECRET is required}
      EZVIZ_REDIRECT_URI: ${EZVIZ_REDIRECT_URI:?EZVIZ_REDIRECT_URI is required}
      EZVIZ_FRONTEND_URL: ${EZVIZ_FRONTEND_URL:?EZVIZ_FRONTEND_URL is required}
      EZVIZ_WEBHOOK_ENABLED: ${EZVIZ_WEBHOOK_ENABLED:-false}
      EZVIZ_WEBHOOK_SECRET: ${EZVIZ_WEBHOOK_SECRET:-}
      EZVIZ_WEBHOOK_MAX_CLOCK_SKEW_SECONDS: ${EZVIZ_WEBHOOK_MAX_CLOCK_SKEW_SECONDS:-600}
      ALARM_SYNC_ENABLED: ${ALARM_SYNC_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend

volumes:
  mysql-data:
